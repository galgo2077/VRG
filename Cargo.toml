[workspace]
resolver = "3"
members = ["."]

[package]
name = "vrg"
version = "0.7.0-rc.1"
edition = "2024"
rust-version = "1.92"
description = "Local-first Vault RAG Graph backend"
license = "MIT OR Apache-2.0"
repository = "https://github.com/galgo2077/VRG"
homepage = "https://galgo2077.github.io/VRG/"
readme = "README.md"
include = ["src/**", "tests/**", "scripts/*.py", "schemas/**", "examples/**", "docs/**", "README.md", "CHANGELOG.md", "specs/setup-doctor/**", "LICENSE-*", "Cargo.toml", "Cargo.lock"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vrg"
path = "src/main.rs"

[features]
f4-instrumentation = []

[dependencies]
axum = "=0.8.8"
tower = { version = "=0.5.3", features = ["util", "limit"] }
hmac = "=0.13.0"
cap-std = "=4.0.3"
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
flate2 = "=1.1.10"
pulldown-cmark = "=0.13.5"
rmcp = { version = "=1.8.0", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }
notify = "=8.2.1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "fs", "signal", "time"] }
toml = "=1.1.8+spec-1.1.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
fastembed = "=7.5.0"

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
fastembed = { version = "=7.5.0", default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "load-dynamic"] }
libloading = "=0.9.0"

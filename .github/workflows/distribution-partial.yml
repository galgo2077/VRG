name: Partial distribution candidate

on:
  push:
    branches: ['ci/setup-partial-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: Prepare pinned semantic fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download and verify the pinned upstream fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/vrg-e5-model"
          base=https://huggingface.co/intfloat/multilingual-e5-small/resolve/614241f622f53c4eeff9890bdc4f31cfecc418b3/onnx
          for file in model.onnx tokenizer.json config.json special_tokens_map.json tokenizer_config.json; do
            curl --disable --fail --location --silent --show-error --connect-timeout 15 --max-time 900 "$base/$file" -o "$RUNNER_TEMP/vrg-e5-model/$file"
          done
          cd "$RUNNER_TEMP/vrg-e5-model"
          printf '%s  %s\n' \
            ca456c06b3a9505ddfd9131408916dd79290368331e7d76bb621f1cba6bc8665 model.onnx \
            0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39 tokenizer.json \
            bbb7c1333fc4b3e27fbc9cd5d2070aabcc1d4dfb99917c3633e772f97545a6b6 config.json \
            d05497f1da52c5e09554c0cd874037a083e1dc1b9cfd48034d1c717f1afc07a7 special_tokens_map.json \
            a1d6bc8734a6f635dc158508bef000f8e2e5a759c7d92f984b2c86e5ff53425b tokenizer_config.json | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: partial-pinned-e5-fixture
          path: ${{ runner.temp }}/vrg-e5-model/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  semantic:
    name: ${{ matrix.name }} semantic candidate
    needs: model
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Verify host and fetch locked Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          test "$(rustc +1.98.0 -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
          cargo +1.98.0 fetch --locked --target '${{ matrix.target }}'
      - name: Build candidate with locked cached dependencies
        run: cargo +1.98.0 build --release --locked --offline --target '${{ matrix.target }}'
      - name: Check isolated installed binary and direct MCP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vrg-package"
          cp "target/${{ matrix.target }}/release/vrg" "$RUNNER_TEMP/vrg-package/vrg"
          test -x "$RUNNER_TEMP/vrg-package/vrg"
          expected=$(cargo +1.98.0 metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "vrg"))')
          test "$("$RUNNER_TEMP/vrg-package/vrg" --version)" = "vrg $expected"
          "$RUNNER_TEMP/vrg-package/vrg" --help >/dev/null
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/scripts/ci_distribution_smoke.py" "$RUNNER_TEMP/vrg-package/vrg" --without-memory
      - uses: actions/download-artifact@v4
        with:
          name: partial-pinned-e5-fixture
          path: ${{ runner.temp }}/vrg-e5-model
      - name: Verify real E5 inference and semantic retrieval
        run: python3 scripts/ci_semantic_smoke.py "$RUNNER_TEMP/vrg-package/vrg" "$RUNNER_TEMP/vrg-e5-model"
      - name: Package candidate with capability and build metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo +1.98.0 metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "vrg"))')
          stage="$RUNNER_TEMP/vrg-package"
          cp LICENSE-* README.md "$stage/"
          printf '%s\n' 'Text retrieval: tested.' 'E5 semantic retrieval: tested with a pinned local fixture.' 'Hook setup and supervisor repair: not tested; operational memory was not configured.' 'Real Codex integration: not certified by this workflow.' > "$stage/CAPABILITIES.txt"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s\n' "$RUNNER_OS"
            printf 'platform='; uname -smr
            rustc +1.98.0 -Vv
            if [ "$(uname -s)" = Linux ]; then
              ldd "$stage/vrg"
              getconf GNU_LIBC_VERSION || true
            else
              sw_vers
              otool -L "$stage/vrg"
            fi
          } > "$stage/BUILD-ENVIRONMENT.txt"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/vrg-v${version}-${{ matrix.name }}.tar.gz" vrg-package
          python3 -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); p.with_suffix(p.suffix+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")' "dist/vrg-v${version}-${{ matrix.name }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: partial-vrg-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  intel_text:
    name: macOS Intel text-only candidate
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Verify native Intel host and fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(rustc +1.98.0 -vV | sed -n 's/^host: //p')" = x86_64-apple-darwin
          cargo +1.98.0 fetch --locked --target x86_64-apple-darwin
      - name: Build candidate with locked cached dependencies
        run: cargo +1.98.0 build --release --locked --offline --target x86_64-apple-darwin
      - name: Test native Intel runtime cache safeguards
        run: cargo +1.98.0 test --release --locked --offline --target x86_64-apple-darwin --lib onnx_source_setup
      - name: Verify isolated text setup, doctor and direct MCP without an ONNX dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vrg-package"
          cp target/x86_64-apple-darwin/release/vrg "$RUNNER_TEMP/vrg-package/vrg"
          test -x "$RUNNER_TEMP/vrg-package/vrg"
          test ! -e "$RUNNER_TEMP/vrg-package/libonnxruntime.dylib"
          expected=$(cargo +1.98.0 metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "vrg"))')
          test "$("$RUNNER_TEMP/vrg-package/vrg" --version)" = "vrg $expected"
          "$RUNNER_TEMP/vrg-package/vrg" --help >/dev/null
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/scripts/ci_distribution_smoke.py" "$RUNNER_TEMP/vrg-package/vrg" --without-memory
      - name: Package explicitly text-only candidate
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo +1.98.0 metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "vrg"))')
          stage="$RUNNER_TEMP/vrg-package"
          cp LICENSE-* README.md "$stage/"
          printf '%s\n' 'Text retrieval: tested.' 'Intel semantic retrieval: not certified; no ONNX runtime is included.' 'Hook setup and supervisor repair: not tested; operational memory was not configured.' 'Real Codex integration: not certified by this workflow.' > "$stage/CAPABILITIES.txt"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'platform='; uname -smr
            rustc +1.98.0 -Vv
            sw_vers
            otool -L "$stage/vrg"
          } > "$stage/BUILD-ENVIRONMENT.txt"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/vrg-v${version}-macos-x86_64-text-only.tar.gz" vrg-package
          python3 -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); p.with_suffix(p.suffix+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")' "dist/vrg-v${version}-macos-x86_64-text-only.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: partial-vrg-macos-x86_64-text-only
          path: dist/*
          if-no-files-found: error
          retention-days: 14
